name: Terraform Validation

on:
  push:
    branches:
      - main

jobs:
  terraform:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: primary-centralindia

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.TERRAFORM_SP }}

      - name: Install Az PowerShell Modules
        shell: pwsh
        run: |
          Install-Module Az -Force -Scope CurrentUser -AllowClobber

      - name: Run Terraform Backend Bootstrap
        shell: pwsh
        run: |
          ./Bootstrap-TerraformBackend.ps1 `
            -SubscriptionId "${{ vars.TF_SUBSCRIPTION_ID }}" `
            -ResourceGroupName "${{ vars.TF_STATE_RG }}" `
            -StorageAccountName "${{ vars.TF_STATE_STORAGE }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: primary-centralindia/tfplan